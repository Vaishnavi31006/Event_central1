name: event_central
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  # Firebase (same generation – correct)
  firebase_core: ^3.15.2
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.6.12
  intl: ^0.19.0

  # Other packages
  google_sign_in: ^6.1.0
  table_calendar: ^3.0.9
  percent_indicator: ^4.2.2
  qr_flutter: ^4.0.0
  url_launcher: ^6.3.0

  # iOS icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/logo/

flutter_icons:
  android: true
  ios: true
  image_path: "D:/event_central/assets/logo/logo_projfinn.jpg.png"
